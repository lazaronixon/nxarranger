name: Build

# Every push and pull request builds and tests on macOS and Windows.
# Pushing a tag vX.Y.Z also packages both and publishes a GitHub Release.
# Running the workflow manually packages without releasing (to test the downloads).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: 6.8.3

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            qt_arch: clang_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(NXArranger VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release tag must match the version the app reports.
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            # Universal app (Apple silicon + Intel); Qt 6.8 needs macOS 12+.
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (macOS)
        if: env.PACKAGE == 'true' && runner.os == 'macOS'
        run: |
          macdeployqt build/NXArranger.app
          # macdeployqt invalidates the signature; Apple silicon needs at least an ad-hoc one.
          codesign --force --deep --sign - build/NXArranger.app
          mkdir dmg
          cp -R build/NXArranger.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname NXArranger -srcfolder dmg -ov -format UDZO \
            "NXArranger-${{ steps.version.outputs.version }}-macos.dmg"

      - name: Package (Windows)
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "NXArranger-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item build/Release/NXArranger.exe $name/
          windeployqt --release --no-translations "$name/NXArranger.exe"
          # Ship the MSVC runtime next to the exe so the zip runs without an installer.
          Copy-Item C:/Windows/System32/msvcp140*.dll, C:/Windows/System32/vcruntime140*.dll $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Upload package
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            *.dmg
            *.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NXArranger ${GITHUB_REF_NAME#v}" \
            --generate-notes
